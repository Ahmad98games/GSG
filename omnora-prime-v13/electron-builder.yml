appId: com.omnoralabs.noxis
productName: Noxis Hub
copyright: Copyright 2026 Omnora Labs

directories:
  buildResources: build
  output: dist

# Optimized compression balance: fast extraction & rapid installs
compression: normal

# Files to include in app.asar (minimal for speed and reliability)
files:
  - "dist-electron/**/*"
  - "package.json"
  - "!src/**"
  - "!android/**"
  - "!supabase/**"
  - "!scripts/**"
  - "!software images/**"
  - "!coverage/**"
  - "!winCodeSign/**"
  - "!**/*.ts"
  - "!**/*.map"
  - "!**/*.md"
  - "!**/@sentry/cli*/**"
  - "!**/@sentry/cli*/**/*"
  - "!**/sentry-cli*"

asarUnpack:
  - "**/*.node"

# Extra resources copied to resources/
# Filtered to exclude heavy development junk (.map, .d.ts, tests, docs) for ultra-fast extraction
extraResources:
  # The Next.js standalone bundle (excluding node_modules so it is not processed twice)
  - from: ".next/standalone"
    to: "standalone"
    filter:
      - "**/*"
      - "!node_modules/**"
      - "!*.db"
      - "!*.db-shm"
      - "!*.db-wal"
      - "!*.sqlite"
      - "!*.sqlite3"
      - "!**/*.map"
      - "!**/*.d.ts"
      - "!**/*.d.ts.map"
      - "!**/*.md"
      - "!**/tests/**"
      - "!**/test/**"
      - "!**/__tests__/**"

  # Next.js standalone dependencies (runtime production only)
  - from: ".next/standalone/node_modules"
    to: "standalone/node_modules"
    filter:
      - "**/*"
      - "!**/*.map"
      - "!**/*.d.ts"
      - "!**/*.d.ts.map"
      - "!**/*.md"
      - "!**/tests/**"
      - "!**/test/**"
      - "!**/__tests__/**"

  # Native SQLite binding — CRITICAL
  - from: "node_modules/better-sqlite3-multiple-ciphers"
    to: "better-sqlite3-multiple-ciphers"
    filter:
      - "**/*"
      - "!deps"
      - "!src"
      - "!*.md"
      - "!**/*.map"
      - "!**/*.d.ts"

  # Build assets (icon etc)
  - from: "build"
    to: "build"
    filter:
      - "**/*"

  # mediamtx WebRTC/RTSP proxy binary
  - from: "resources/mediamtx"
    to: "mediamtx"
    filter:
      - "mediamtx.exe"

  # Environment file
  - from: ".env.local"
    to: ".env"

win:
  icon: "build/icon.ico"
  target:
    - target: nsis
      arch:
        - x64
  forceCodeSigning: false

nsis:
  include: "assets/installer.nsh"
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: "Noxis Hub"
  installerIcon: "build/icon.ico"
  uninstallerIcon: "build/icon.ico"
  installerHeader: "build/installerHeader.bmp"
  installerSidebar: "build/installerSidebar.bmp"
  uninstallDisplayName: "Noxis Hub"
  allowElevation: true
  perMachine: false
  differentialPackage: true
  runAfterFinish: true

mac:
  icon: "build/icon.icns"
  category: public.app-category.business

linux:
  icon: "build/icon.png"
  category: Office

publish:
  provider: generic
  url: https://noxishub.app/updates/stable
  channel: stable
  useMultipleRangeRequest: true

# Rebuild native modules for the correct
# Electron Node.js ABI version
npmRebuild: false
electronVersion: "41.4.0"

electronDownload:
  mirror: "https://npmmirror.com/mirrors/electron/"
