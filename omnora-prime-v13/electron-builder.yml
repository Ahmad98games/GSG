appId: com.omnoralabs.noxis
productName: Noxis Hub
copyright: Copyright 2026 Omnora Labs

directories:
  buildResources: build
  output: dist

# Fast compression for significantly faster installer generation
compression: normal

# Files to include in app.asar (minimal for speed and reliability)
files:
  - "dist-electron/**/*"
  - "package.json"
  - "!src/**"
  - "!android/**"
  - "!supabase/**"
  - "!scripts/**"
  - "!software images/**"
  - "!coverage/**"
  - "!winCodeSign/**"
  - "!**/*.ts"
  - "!**/*.map"
  - "!**/*.md"

# Extra resources copied to resources/
# These are accessible via process.resourcesPath
extraResources:
  # The Next.js standalone bundle (already fully assembled with static, public, migrations, node_modules by build-electron.mjs)
  - from: ".next/standalone"
    to: "standalone"
    filter:
      - "**/*"

  # Next.js standalone dependencies
  - from: ".next/standalone/node_modules"
    to: "standalone/node_modules"
    filter:
      - "**/*"

  # Native SQLite binding — CRITICAL
  # Without this the server crashes instantly
  - from: "node_modules/better-sqlite3-multiple-ciphers"
    to: "better-sqlite3-multiple-ciphers"
    filter:
      - "**/*"
      - "!deps"
      - "!src"
      - "!*.md"

  # Build assets (icon etc)
  - from: "build"
    to: "build"
    filter:
      - "**/*"

  # mediamtx WebRTC/RTSP proxy binary
  # Used to convert RTSP camera streams to WebRTC for in-app viewing
  # Only the .exe is included — config is generated at runtime
  - from: "resources/mediamtx"
    to: "mediamtx"
    filter:
      - "mediamtx.exe"

  # Environment file
  - from: ".env.local"
    to: ".env"

win:
  icon: "build/icon.ico"
  target:
    - target: nsis
      arch:
        - x64
  forceCodeSigning: false

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: "Noxis Hub"
  installerIcon: "build/icon.ico"
  uninstallerIcon: "build/icon.ico"
  installerHeader: "build/installerHeader.bmp"
  installerSidebar: "build/installerSidebar.bmp"
  uninstallDisplayName: "Noxis Hub"
  allowElevation: true
  perMachine: false
  differentialPackage: false

mac:
  icon: "build/icon.icns"
  category: public.app-category.business

linux:
  icon: "build/icon.png"
  category: Office

publish:
  provider: generic
  url: https://pub-9293149a463a4eb5b1db3df28d613e59.r2.dev/updates/stable
  channel: stable

# Rebuild native modules for the correct
# Electron Node.js ABI version
npmRebuild: false
electronVersion: "41.4.0"

electronDownload:
  mirror: "https://npmmirror.com/mirrors/electron/"
